<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drifted out with the tide — bostonai.io</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,340;1,9..144,340&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: linear-gradient(180deg, #070b16 0%, #0b1020 60%, #10182e 82%, #060a14 82.2%, #04070e 100%);
      color: #e9e4d8;
      font-family: "Fraunces", Georgia, serif;
      display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 2rem;
    }
    .tide h1 {
      font-weight: 340; font-style: italic;
      font-size: clamp(1.6rem, 5vw, 2.6rem);
      margin-bottom: 1.2rem; line-height: 1.35;
    }
    .tide p {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.85rem; color: #b0aa9c; margin-bottom: 2.2rem;
    }
    .tide a {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.85rem; letter-spacing: 0.12em; text-transform: uppercase;
      color: #d9a662; text-decoration: none;
      border: 1px solid rgba(217,166,98,0.4); border-radius: 999px;
      padding: 0.7rem 1.5rem;
    }
    .tide a:hover { border-color: #d9a662; }
  </style>
</head>
<body>
  <main class="tide">
    <h1>This page drifted out with the tide.</h1>
    <p>404 — the harbor keeps no record of it.</p>
    <a href="/">Back to the sky</a>
  </main>
</body>
</html>
