<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/>
      <stop offset="0.75" stop-color="#141c36"/>
      <stop offset="1" stop-color="#2a2440"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="13" fill="url(#sky)"/>
  <!-- moon -->
  <circle cx="43" cy="19" r="8" fill="#e6e2d4"/>
  <circle cx="40" cy="17" r="7" fill="#141c36"/>
  <!-- stars -->
  <circle cx="15" cy="13" r="1" fill="#d6e0ff" opacity="0.8"/>
  <circle cx="25" cy="21" r="0.8" fill="#d6e0ff" opacity="0.6"/>
  <circle cx="54" cy="30" r="0.8" fill="#ffe0b2" opacity="0.7"/>
  <!-- skyline -->
  <g fill="#07090f">
    <rect x="6" y="36" width="6" height="15"/>
    <rect x="13" y="30" width="5" height="21"/>
    <polygon points="20,51 20,26 22.5,22 25,26 25,51"/>
    <rect x="27" y="33" width="7" height="18"/>
    <rect x="35" y="27" width="6" height="24"/>
    <rect x="42" y="35" width="5" height="16"/>
    <rect x="48" y="31" width="7" height="20"/>
    <rect x="50.5" y="26" width="1.5" height="5"/>
  </g>
  <!-- water -->
  <rect x="0" y="50" width="64" height="14" fill="#060a14"/>
  <g fill="#cfd6e8" opacity="0.35">
    <rect x="10" y="54" width="7" height="1"/>
    <rect x="30" y="57" width="9" height="1"/>
    <rect x="48" y="53" width="6" height="1"/>
    <rect x="20" y="60" width="8" height="1"/>
  </g>
</svg>
